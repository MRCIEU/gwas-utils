[package]
name = "gwas-utils"
version = "0.19.0"
edition = "2024"
rust-version = "1.89"
description = "Command-line utilities for working with GWAS summary statistics files"
license = "MIT"
repository = "https://github.com/MRCIEU/gwas-utils"
readme = "README.md"

[dependencies]
clap = { version = "4.6.0", features = ["derive", "cargo"] }
csv = "1.4.0"
flate2 = "1.1.9"
gzp = "2.0.4"
regex = "1.12.3"
serde_json = "1.0.149"
statrs = { version = "0.19.1", default-features = false, features = ["std"] }
thiserror = "2.0.18"

[[bin]]
name = "gu"
path = "src/main.rs"
