[package]
name = "gwas-utils"
version = "0.16.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive", "cargo"] }
csv = "1.4.0"
flate2 = "1.1.9"
gzp = "2.0.4"
regex = "1.12.3"
serde_json = "1.0.149"
statrs = { version = "0.19.1", default-features = false, features = ["std"] }
thiserror = "2.0.18"

[[bin]]
name = "gu"
path = "src/main.rs"
